name: Verify and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned revisions must be rechecked against official release pages before first dispatch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:component
      - run: npm run test:db:static
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop
      - name: Validate production configuration
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SCHEMA_VERSION: ${{ vars.VITE_SCHEMA_VERSION }}
          VITE_NORMALIZATION_VERSION: ${{ vars.VITE_NORMALIZATION_VERSION }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_SCHEMA_VERSION"
          test -n "$VITE_NORMALIZATION_VERSION"
      - name: Build the production artifact
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SCHEMA_VERSION: ${{ vars.VITE_SCHEMA_VERSION }}
          VITE_NORMALIZATION_VERSION: ${{ vars.VITE_NORMALIZATION_VERSION }}
        run: npm run build
      - name: Smoke-test the configured production artifact
        if: github.event_name != 'pull_request'
        env:
          VITE_SCHEMA_VERSION: ${{ vars.VITE_SCHEMA_VERSION }}
          VITE_NORMALIZATION_VERSION: ${{ vars.VITE_NORMALIZATION_VERSION }}
        run: npm run test:e2e:production
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
